name: Scaffold dev smoke

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dev-smoke:
    name: bun run preview — worker + static smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('scaffold/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        working-directory: scaffold
        run: bun i --frozen-lockfile

      - name: Run preview-server smoke tests
        working-directory: scaffold
        run: bun test test/dev-smoke.test.ts

      # The smoke test builds, which regenerates the page_summary block. The
      # generator replaces from the first `<page_summary>` it finds, so a stray
      # tag above the block would silently wipe the agent rules.
      - name: AGENTS.md rules survive the build
        working-directory: scaffold
        run: |
          test "$(grep -c '<page_summary>' AGENTS.md)" -eq 1
          grep -q '^## Mandatory Workflow' AGENTS.md
