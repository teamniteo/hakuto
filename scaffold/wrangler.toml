name = 'hakuto-site'
main="worker/index.js"
compatibility_date = "2026-06-24"
preview_urls = true
workers_dev = true

[observability.logs]
enabled = false

[placement]
mode = "smart"

[assets]
directory = "./dist/client"
not_found_handling = "404-page"
html_handling = "force-trailing-slash"
run_worker_first = ["/~*"]

